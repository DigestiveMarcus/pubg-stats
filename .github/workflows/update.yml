name: Uppdatera statistik

on:
  schedule:
    - cron: "*/30 * * * *"   # var 30:e minut
  workflow_dispatch:          # knappen "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node fetch.js
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
      - name: Spara stats.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || (git commit -m "Uppdatera statistik" && git push)
